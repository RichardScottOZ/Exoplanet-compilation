[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exoplanet-compilation"
version = "0.1.0"
description = "Multi-source exoplanet database integration and visualization"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "Richard Scott" }
]
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "requests>=2.31.0",
  "astroquery>=0.4.6",
  "matplotlib>=3.7.0",
  "seaborn>=0.12.0",
  "plotly>=5.14.0",
  "bokeh>=3.1.0",
  "astropy>=5.3.0",
  "jupyter>=1.0.0",
  "ipywidgets>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/RichardScottOZ/Exoplanet-compilation"
Repository = "https://github.com/RichardScottOZ/Exoplanet-compilation"

[project.scripts]
exoplanet-compilation = "main:main"

[tool.setuptools]
py-modules = [
  "main",
  "exoplanet_data_sources",
  "exoplanet_visualizations",
  "demo_data_generator",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["exoplanet_compilation"]
